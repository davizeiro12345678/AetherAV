name: Detection quality gate unit tests

on:
  pull_request:
    paths:
      - 'tools/detection_quality_gate.py'
      - 'tools/train_pe_model.py'
      - 'tools/threshold_calibration.py'
      - 'tools/test_threshold_calibration.py'
      - 'tools/behavioral_fusion.py'
      - 'tools/test_behavioral_fusion.py'
      - 'tools/elf_hard_example_training.py'
      - 'tools/holdout_evidence.py'
      - 'tools/test_holdout_evidence.py'
      - 'tools/build_exclusion_set.py'
      - 'tools/test_build_exclusion_set.py'
      - 'crates/aether-behavior/src/rules.rs'
      - 'docs/BEHAVIORAL_ENSEMBLE_R5.md'
      - 'tools/test_detection_quality_gate.py'
      - 'docs/DETECTION_TARGETS.md'
      - '.github/workflows/detection-quality-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/detection_quality_gate.py'
      - 'tools/train_pe_model.py'
      - 'tools/threshold_calibration.py'
      - 'tools/test_threshold_calibration.py'
      - 'tools/test_detection_quality_gate.py'
      - '.github/workflows/detection-quality-unit-tests.yml'

permissions:
  contents: read

jobs:
  quality-gate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PE training script syntax
        run: python3 -m py_compile tools/train_pe_model.py tools/behavioral_fusion.py tools/elf_hard_example_training.py tools/holdout_evidence.py tools/build_exclusion_set.py
      - name: Run detection quality gate tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
